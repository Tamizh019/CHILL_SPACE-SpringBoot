<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill Space - Modern Chat Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/home.css">
</head>

<body>
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <!-- Main App Container -->
    <div class="app-wrapper">

        <!-- Top Navigation Bar -->
        <nav class="top-navbar">
            <div class="nav-left">
                <div class="logo-container">
                    <div class="logo-icon">
                        <i class="fas fa-rocket"></i>
                    </div>
                    <div class="logo-text">
                        <h1>CHILL SPACE</h1>
                        <span class="tagline">Where vibes meet</span>
                    </div>
                </div>
            </div>

            <div class="nav-center">
                <div class="tab-switcher">
                    <button class="tab-btn active" data-tab="chat">
                        <i class="fas fa-comments"></i>
                        <span>Chat</span>
                    </button>
                    <button class="tab-btn" data-tab="files">
                        <i class="fas fa-folder"></i>
                        <span>Files</span>
                    </button>
                </div>
            </div>

            <div class="nav-right">
                <div class="user-menu">
                    <div class="user-avatar-btn" id="userAvatarBtn">
                        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=User" id="headerAvatar" alt="Avatar">
                        <div class="status-dot online"></div>
                    </div>
                    <div class="dropdown-menu" id="userDropdown">
                        <div class="dropdown-header">
                            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=User" alt="Avatar">
                            <div>
                                <h4 id="dropdownUsername">Username</h4>
                                <p id="dropdownRole">User</p>
                            </div>
                        </div>
                        <div class="dropdown-divider"></div>
                        <a href="#" class="dropdown-item" id="profileMenuItem"><i class="fas fa-user"></i> Profile</a>
                        <a href="#" class="dropdown-item"><i class="fas fa-cog"></i> Settings</a>
                        <a href="#" class="dropdown-item"><i class="fas fa-moon"></i> Dark Mode</a>
                        <div class="dropdown-divider"></div>
                        <a href="#" class="dropdown-item danger" id="logoutBtn">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <div class="main-container">

            <!-- Chat Section -->
            <section class="chat-container">

                <!-- Chat Header -->
                <div class="chat-header">
                    <div class="chat-info">
                        <h2>Group Chat</h2>
                        <p><span class="online-indicator"></span> <span id="onlineCount">0</span> members online</p>
                    </div>
                </div>

                <!-- Messages Area -->
                <div class="messages-container" id="chatMessages">
                    <!-- Welcome Message -->
                    <div class="welcome-card">
                        <div class="welcome-icon">
                            <i class="fas fa-rocket"></i>
                        </div>
                        <h3>Welcome to Group Chat</h3>
                        <p>This is the beginning of your legendary journey!</p>
                    </div>
                </div>

                <!-- Typing Indicator -->
                <div class="typing-indicator" id="typingIndicator" style="display: none;">
                    <div class="typing-avatar">
                        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=typing" alt="">
                    </div>
                    <div class="typing-text">
                        <span class="typing-user">Someone</span> is typing
                        <div class="typing-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>

                <!-- Message Input -->
                <div class="message-input-container">
                    <div class="input-wrapper">
                        <div class="input-field-wrapper">
                            <input type="text" id="chatInput" placeholder="Message" autocomplete="off"
                                maxlength="2000" />
                            <div class="input-actions">
                                <button class="emoji-btn" title="Add Emoji">
                                    <i class="fas fa-smile"></i>
                                </button>
                            </div>
                        </div>

                        <button class="send-button" id="sendBtn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    <div class="input-footer">
                        <span class="char-count"><span id="charCount">0</span>/2000</span>
                    </div>
                </div>

            </section>

            <!-- Right Sidebar -->
            <aside class="members-sidebar">

                <!-- Sidebar Header -->
                <div class="sidebar-header">
                    <h3>Members</h3>
                    <span class="member-count" id="totalMembers">0</span>
                </div>

                <!-- Online Members -->
                <div class="members-section">
                    <div class="section-title">
                        <span class="status-dot online"></span>
                        ONLINE — <span id="onlineCountSidebar">0</span>
                    </div>
                    <div class="members-list" id="onlineMembersList">
                        <!-- Populated via JS -->
                    </div>
                </div>

                <!-- Offline Members -->
                <div class="members-section">
                    <div class="section-title">
                        <span class="status-dot offline"></span>
                        OFFLINE — <span id="offlineCount">0</span>
                    </div>
                    <div class="members-list" id="offlineMembersList">
                        <!-- Populated via JS -->
                    </div>
                </div>

            </aside>

        </div>
    </div>

    <!-- Member Profile Modal -->
    <div class="modal" id="profileModal">
        <div class="modal-content profile-card">
            <button class="modal-close"><i class="fas fa-times"></i></button>
            <div class="profile-banner"></div>
            <div class="profile-body">
                <div class="profile-avatar">
                    <img src="" alt="" id="modalAvatar">
                    <div class="status-dot online"></div>
                </div>
                <h2 id="modalUsername">Username</h2>
                <p class="profile-role" id="modalRole">User</p>
                <div class="profile-stats">
                    <div class="stat">
                        <span class="stat-value">24</span>
                        <span class="stat-label">Messages</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value">12</span>
                        <span class="stat-label">Days Active</span>
                    </div>
                </div>
                <button class="btn-primary"><i class="fas fa-comment"></i> Send Message</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="js/chat.js"></script>

</body>

</html>
